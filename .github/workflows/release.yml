name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested archive as a GitHub release
        type: boolean
        default: false

concurrency: sdk-release

permissions:
  contents: read

env:
  SDK_VERSION: "26.5"

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install -e tools/
          brew install cmake ninja zstd bazelisk

      - name: Restore the private DocC snapshot
        env:
          DOCC_R2_ENDPOINT: ${{ vars.DOCC_R2_ENDPOINT }}
          DOCC_R2_BUCKET: ${{ vars.DOCC_R2_BUCKET }}
          DOCC_R2_SNAPSHOT_KEY: ${{ vars.DOCC_R2_SNAPSHOT_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCC_R2_SECRET_ACCESS_KEY }}
        run: bash release/docc-cache.sh restore cache

      - name: Generate frameworks and linker stubs
        run: |
          python3 -m tools.apple_sdk_gen --sdk-version "$SDK_VERSION" \
            --all-frameworks --include-cxx --reuse-docc-cache --cache-dir cache --output build/generated -v

      - name: Save new DocC responses
        if: github.ref == 'refs/heads/main'
        env:
          DOCC_R2_ENDPOINT: ${{ vars.DOCC_R2_ENDPOINT }}
          DOCC_R2_BUCKET: ${{ vars.DOCC_R2_BUCKET }}
          DOCC_R2_SNAPSHOT_KEY: ${{ vars.DOCC_R2_SNAPSHOT_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCC_R2_SECRET_ACCESS_KEY }}
        run: bash release/docc-cache.sh save cache

      - name: Read C SDK commit
        id: c-sdk
        run: echo "commit=$(cat release/c-sdk.commit)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: hermeticbuild/apple-oss-c-sdk
          ref: ${{ steps.c-sdk.outputs.commit }}
          token: ${{ secrets.C_SDK_READ_TOKEN }}
          path: build/c-sdk
          persist-credentials: false

      - name: Build and compose the SDK
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_SDK: build/generated/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
        run: release/build-composed-sdk.sh build/c-sdk "$GENERATED_SDK" build/sdk

      - name: Run the C and framework probes
        run: release/test-composed-sdk.sh build/c-sdk build/sdk

      - name: Test BCR consumers
        working-directory: e2e/bcr
        env:
          USE_BAZEL_VERSION: "9.3.2"
        run: |
          bazelisk --nohome_rc test --platforms=@llvm//platforms:macos_arm64 \
            --@llvm//config:macos_libcxx_headers=sdk \
            --@curl//:ssl_lib=mbedtls //:framework_consumers

      - name: Test LLVM and Rust SDK consumers
        working-directory: e2e
        env:
          USE_BAZEL_VERSION: "9.3.2"
        run: bazelisk --nohome_rc test --keep_going //:hermetic_llvm //:rules_rs

      - name: Record SDK checksum
        working-directory: build/sdk
        run: shasum -a 256 MacOSX.sdk.tar.zst | tee MacOSX.sdk.tar.zst.sha256

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && inputs.publish
        with:
          name: macos-arm64-sdk
          path: |
            build/sdk/MacOSX.sdk.tar.zst
            build/sdk/MacOSX.sdk.tar.zst.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64-sdk

      - name: Publish the tested SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c MacOSX.sdk.tar.zst.sha256
          latest=$(git tag --list '[0-9]*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=0.0.1
          else
            prefix="${latest%.*}"
            patch="${latest##*.}"
            next="$prefix.$((patch + 1))"
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" \
            --generate-notes MacOSX.sdk.tar.zst MacOSX.sdk.tar.zst.sha256
