name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both tested SDK archives as a GitHub release
        type: boolean
        default: false

concurrency: sdk-release

permissions:
  contents: read

env:
  SDK_VERSION: "26.5"

jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      USE_BAZEL_VERSION: "9.3.2"
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"

      - name: Record runner tool versions
        run: |
          python3 --version
          xcodebuild -version
          cmake --version
          ninja --version
          zstd --version
          aws --version
          bazelisk version

      - name: Prepare SDK inputs
        env:
          DOCC_R2_ENDPOINT: ${{ vars.DOCC_R2_ENDPOINT }}
          DOCC_R2_BUCKET: ${{ vars.DOCC_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DOCC_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCC_R2_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          make prepare SDK="macosx$SDK_VERSION"
          echo "$PWD/build/inputs/python/bin" >> "$GITHUB_PATH"

      - name: Generate frameworks and linker stubs
        run: |
          python3 -m tools.apple_sdk_gen --sdk-version "$SDK_VERSION" \
            --all-frameworks --include-cxx --llvm-dir build/inputs/llvm --docc-cache-only --cache-dir build/inputs/docc --output build/generated -v

      - name: Build and compose the SDK
        env:
          GENERATED_SDK: build/generated/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
        run: release/build-composed-sdk.sh "$GENERATED_SDK" build/sdk

      - name: Run the C and framework probes
        run: release/test-composed-sdk.sh build/sdk

      - name: Test BCR consumers
        working-directory: e2e/bcr
        run: |
          bazelisk --nohome_rc test --test_output=errors --platforms=@llvm//platforms:macos_arm64 \
            --@llvm//config:macos_libcxx_headers=sdk \
            --@curl//:ssl_lib=mbedtls //:framework_consumers

      - name: Build and run SQLite against the minimal SDK
        working-directory: e2e/c-sdk
        run: |
          bazelisk --nohome_rc run --platforms=@llvm//platforms:macos_arm64 \
            --@llvm//config:macos_libcxx_headers=llvm \
            --run_under="$PWD/sqlite-smoke.sh" @sqlite3//:shell

      # rules_rs tests SSH-form GitHub URLs for a public Git dependency.
      - name: Fetch public GitHub SSH dependencies over HTTPS
        run: |
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Test LLVM and Rust SDK consumers
        working-directory: e2e
        run: bazelisk --nohome_rc test --keep_going --test_output=errors //:hermetic_llvm //:rules_rs

      - name: Record SDK checksums
        working-directory: build/sdk
        run: |
          for archive in MacOSX.sdk.tar.zst MacOSX-Minimal.sdk.tar.zst; do
            shasum -a 256 "$archive" | tee "$archive.sha256"
          done

      - name: Attest the tested SDK
        if: github.ref == 'refs/heads/main' && inputs.publish
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/sdk/MacOSX.sdk.tar.zst
            build/sdk/MacOSX.sdk.tar.zst.sha256
            build/sdk/MacOSX-Minimal.sdk.tar.zst
            build/sdk/MacOSX-Minimal.sdk.tar.zst.sha256

      - name: Name the attestation bundle
        if: github.ref == 'refs/heads/main' && inputs.publish
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" build/sdk/MacOSX.sdk.tar.zst.attestation.jsonl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref == 'refs/heads/main' && inputs.publish
        with:
          name: macos-arm64-sdk
          path: |
            build/sdk/MacOSX.sdk.tar.zst
            build/sdk/MacOSX.sdk.tar.zst.sha256
            build/sdk/MacOSX.sdk.tar.zst.attestation.jsonl
            build/sdk/MacOSX-Minimal.sdk.tar.zst
            build/sdk/MacOSX-Minimal.sdk.tar.zst.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-arm64-sdk

      - name: Publish the tested SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c MacOSX.sdk.tar.zst.sha256 MacOSX-Minimal.sdk.tar.zst.sha256
          for asset in MacOSX.sdk.tar.zst MacOSX-Minimal.sdk.tar.zst \
            MacOSX.sdk.tar.zst.sha256 MacOSX-Minimal.sdk.tar.zst.sha256; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --bundle MacOSX.sdk.tar.zst.attestation.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          done
          latest=$(git tag --list '[0-9]*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=0.0.1
          else
            prefix="${latest%.*}"
            patch="${latest##*.}"
            next="$prefix.$((patch + 1))"
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" \
            --generate-notes MacOSX.sdk.tar.zst MacOSX.sdk.tar.zst.sha256 \
            MacOSX-Minimal.sdk.tar.zst MacOSX-Minimal.sdk.tar.zst.sha256 \
            MacOSX.sdk.tar.zst.attestation.jsonl
