name: Release

on:
  workflow_dispatch:

concurrency: sdk-release

permissions:
  contents: write

env:
  SDK_VERSION: "26.5"

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Get the latest tag matching X.Y.Z pattern
          latest=$(git tag --list '[0-9]*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="0.0.1"
          else
            major="${latest%%.*}"
            rest="${latest#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      - name: Install dependencies
        run: |
          pip install -e tools/
          brew install gnu-tar ninja

      - name: Build the arm64 macOS SDK
        run: |
          python -m tools.apple_sdk_gen \
            --sdk-version "$SDK_VERSION" \
            --all-frameworks \
            --include-libc \
            --include-cxx \
            --cache-dir cache \
            -v

      - name: Check Darwin exports against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$previous" ]; then
            echo "No published baseline for the first release."
            exit 0
          fi
          baseline=$(mktemp -d)
          asset="macos-arm64-sdk-$SDK_VERSION.tar.zst"
          gh release download "$previous" --pattern "$asset" --dir "$baseline"
          tar -xf "$baseline/$asset" -C "$baseline"
          sdk="Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          approvals="tools/darwin-removals/$previous.tsv"
          if [ -f "$approvals" ]; then
            set -- --approved-removals "$approvals"
          else
            set --
          fi
          python -m tools.apple_sdk_gen.compare_darwin_stubs "$baseline/$sdk" "output/$sdk" "$@"

      - name: Bundle the SDK
        run: |
          gtar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2023-01-01 00:00Z' \
            -cf - -C output Xcode.app | zstd -19 -T0 -o "macos-arm64-sdk-$SDK_VERSION.tar.zst"

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "macos-arm64-sdk-$SDK_VERSION.tar.zst"
